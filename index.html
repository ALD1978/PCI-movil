<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ronda PCI · MILSA</title>
<meta name="theme-color" content="#00292b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ronda PCI">
<style>
:root{--top:#00292b;--fire:#c62828;--aid:#2e7d32;--alarm:#e65100;--ok:#2e7d32;--lim:#b26a00;--ink:#1d1d1f;--mut:#666;--line:#ddd;--bg:#f4f6f5;--card:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:84px}
header{background:var(--top);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center}
header img{width:36px;height:36px;border-radius:9px}
header .t{flex:1;min-width:0}header b{display:block;font-size:16px}header span{font-size:12px;opacity:.85}
header button{font:inherit;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:8px 10px}
main{padding:12px 16px;max-width:640px;margin:0 auto}
h2{font-size:19px;margin:8px 0 10px}h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select,textarea{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff;color:var(--ink);width:100%}
select.bad{border-color:var(--fire);background:#fdecea}select.lim{border-color:var(--lim);background:#fff4e0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;padding:12px 14px;border-radius:10px;border:1px solid #bbb;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.p{background:var(--fire);border-color:var(--fire);color:#fff}.btn.t{background:var(--top);border-color:var(--top);color:#fff}.btn.full{width:100%}.btn.sm{padding:8px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.tabs{display:flex;gap:4px;margin:0 0 10px;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:6px 0}
.tabs button{flex:1;font:inherit;font-size:14px;padding:10px 4px;border:1px solid #bbb;border-radius:10px;background:#fff;color:var(--ink)}
.tabs button[aria-pressed=true]{color:#fff;font-weight:600}.tabs button[data-tab=extintor][aria-pressed=true]{background:var(--fire);border-color:var(--fire)}.tabs button[data-tab=botiquin][aria-pressed=true]{background:var(--aid);border-color:var(--aid)}.tabs button[data-tab=pulsador][aria-pressed=true]{background:var(--alarm);border-color:var(--alarm)}
.tabs small{display:block;font-size:11px;opacity:.85;font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;color:inherit}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.extintor{background:var(--fire)}.dot.botiquin{background:var(--aid)}.dot.pulsador{background:var(--alarm)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.note{font-size:13px;color:var(--mut)}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;background:#eee;white-space:nowrap;display:inline-block}.chip.ok{background:#e3f1e4;color:var(--ok)}.chip.nc{background:#fdecea;color:var(--fire)}.chip.sit{background:#fff3e0;color:var(--alarm)}
.kpis{display:flex;gap:8px;margin-bottom:10px}.kpi{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:20px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ph figure{position:relative;margin:0;width:96px}.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ph figcaption{font-size:11px;color:var(--mut);line-height:1.2;margin-top:2px}
.ph button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:#333;color:#fff;font-size:14px}
.def{display:flex;gap:6px;align-items:center;margin:-4px 0 10px;font-size:13px;color:var(--fire)}
.plano{position:relative;overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:pan-x pan-y pinch-zoom}
.plano .in{position:relative;width:220%}.plano img{display:block;width:100%}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;background:var(--fire);box-shadow:0 0 0 3px var(--fire);animation:pl 1.2s infinite;pointer-events:none}
.mk.old{background:#999;box-shadow:0 0 0 3px #999;animation:none;opacity:.7}
@keyframes pl{50%{box-shadow:0 0 0 9px rgba(198,40,40,.25)}}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}.bar .btn{flex:1}
.hint{background:#fff7e0;border:1px solid #f0d58a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.hint.g{background:#e3f1e4;border-color:#a5d6a7}.hint.r{background:#fdecea;border-color:#f5b5b0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.firma{width:100%;height:160px;border:1px dashed #999;border-radius:8px;background:#fff;touch-action:none;display:block}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 8px}
.hero img{width:120px;height:120px;border-radius:26px}
</style></head><body>
<header><img src="icon-192.png" alt=""><div class="t"><b>Ronda PCI · MILSA</b><span id="h-sub">Departamento de PRL</span></div><button id="h-datos" hidden>⟳ Datos</button></header>
<main id="app"></main>
<input type="file" id="f-datos" hidden>
<script src="jspdf.umd.min.js"></script>
<script>
const PROG=1; // versión del programa
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=s=>s?String(s).slice(0,10).split("-").reverse().join("/"):"";
const hhmm=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

/* ---- IndexedDB: datos (inventario y planos) y lo hecho en la ronda ---- */
let idb;function openDB(){return new Promise((ok,ko)=>{const r=indexedDB.open("pci-movil",1);r.onupgradeneeded=()=>{r.result.createObjectStore("items");r.result.createObjectStore("datos")};r.onsuccess=()=>{idb=r.result;ok()};r.onerror=()=>ko(r.error)})}
const tx=(st,m,f)=>new Promise((ok,ko)=>{const t=idb.transaction(st,m);f(t.objectStore(st));t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)});
const getAll=st=>new Promise((ok,ko)=>{const out={};const c=idb.transaction(st).objectStore(st).openCursor();c.onsuccess=()=>{const x=c.result;if(x){out[x.key]=x.value;x.continue()}else ok(out)};c.onerror=()=>ko(c.error)});
const dbPut=(k,v)=>tx("items","readwrite",s=>s.put(v,k)),dbDel=k=>tx("items","readwrite",s=>s.delete(k)),dbClear=()=>tx("items","readwrite",s=>s.clear());
const datosPut=v=>tx("datos","readwrite",s=>s.put(v,"actual"));

/* ---- estado ---- */
let DATA=null;
const TIPOS=[["extintor","Extintores"],["botiquin","Botiquines"],["pulsador","Pulsadores"]];
const S={ronda:lsGet("pcim.ronda"),items:{},view:"lista",tab:lsGet("pcim.tab")||"extintor",eq:null,fPlano:lsGet("pcim.fplano")||"",soloPend:!!lsGet("pcim.pend"),scroll:{},enviado:lsGet("pcim.enviado")};
const PER=[["T1","1º trimestre"],["T2","2º trimestre"],["T3","3º trimestre"],["T4","4º trimestre"]];
const perAct=()=>"T"+(Math.floor(new Date().getMonth()/3)+1);
const plano=id=>DATA.planos.find(p=>p.id===id);
const todos=()=>[...DATA.equipos,...Object.entries(S.items).filter(([k,v])=>v.nuevo).map(([k,v])=>({id:k,...v.nuevo,nuevoEnRonda:true}))];
const eqById=id=>todos().find(e=>e.id===id);
const pos=e=>{const it=S.items[e.id];return it&&it.pos?it.pos:{planoId:e.planoId,x:e.x,y:e.y}};
const eqsTipo=t=>{const o=id=>{const p=plano(id);return p?p.orden:99};return todos().filter(e=>e.tipo===t).sort((a,b)=>o(pos(a).planoId)-o(pos(b).planoId)||(a.orden??999)-(b.orden??999)||String(a.codigo).localeCompare(String(b.codigo)))};
const esCO2=e=>/CO2|CO₂/i.test(e.agente||"");
// Pulsadores: solo inspección visual; la prueba de funcionamiento es de la revisión anual de la mantenedora.
const PUL=[["accesible","Accesible, visible y señalizado"],["tapa","Tapa / cristal intacto"]];
const filaDef=e=>e.tipo==="extintor"?{senal:"SI",botella:"C",presion:esCO2(e)?"NA":"C",manguera:"C",noLoc:false,obs:"",fecha:""}
  :e.tipo==="botiquin"?{senal:"C",estado:"C",contenido:"C",falta:"",cad:"",retirado:false,obs:"",fecha:""}
  :{accesible:"C",tapa:"C",noLoc:false,obs:"",fecha:""};
const revisado=it=>it&&it.fila&&it.guardado;
const cargado=e=>!!(DATA.cargados||{})[e.id],comprobar=e=>(DATA.comprobar||{})[e.id]||"";
const done=e=>revisado(S.items[e.id])||(cargado(e)&&!comprobar(e));
const malo=f=>!!f&&(Object.entries(f).some(([k,v])=>v==="NC"||(k==="senal"&&v==="NO"))||f.noLoc||f.retirado);
const sinEnviar=()=>Object.values(S.items).filter(v=>v.hora&&(!S.enviado||v.hora>S.enviado)).length;

function cabecera(){$("#h-datos").hidden=!DATA;$("#h-sub").textContent=DATA?`v${PROG} · datos del ${DATA.fecha}`:`v${PROG} · Departamento de PRL`}
function render(){cabecera();const a=$("#app");if(!DATA){a.innerHTML=vSinDatos();bSinDatos();return}
  if(!S.ronda){a.innerHTML=vInicio();bInicio()}else if(S.view==="eq"){a.innerHTML=vEq();bEq()}else if(S.view==="enviar"){a.innerHTML=vEnviar();bEnviar()}else{a.innerHTML=vLista();bLista()}
  window.scrollTo(0,S.view==="lista"?(S.scroll[S.tab]||0):0)}

/* ---- datos ---- */
function vSinDatos(){return`<div class="hero"><img src="icon-512.png" alt=""><h2>Ronda PCI</h2>
<p class="note" style="max-width:34ch">Para empezar, carga el archivo de datos que te ha pasado PRL (<b>PCI-datos-movil…</b>). Se guarda en el móvil y después la app funciona sin cobertura.</p>
<button class="btn t full" id="d-load" style="max-width:320px">Cargar archivo de datos</button>
<p class="note" style="max-width:34ch">Si te llegó por WhatsApp: ábrelo en el chat, descárgalo y búscalo en Descargas o en «WhatsApp Documents».</p></div>`}
function bSinDatos(){$("#d-load").onclick=()=>$("#f-datos").click()}
$("#h-datos").onclick=()=>{if(confirm("¿Cargar un archivo de datos nuevo? Lo que llevas hecho en la ronda se conserva."))$("#f-datos").click()};
$("#f-datos").onchange=async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(e){toast("Ese archivo no es un archivo de datos de la Ronda PCI.");return}
  if(!d||d.formato!=="pci-datos-movil"||!Array.isArray(d.equipos)||!Array.isArray(d.planos)){toast("Ese archivo no es un archivo de datos de la Ronda PCI.");return}
  if((d.programaMin||1)>PROG){alert(`Este archivo de datos necesita la versión ${d.programaMin} del programa y tienes la ${PROG}. Cierra la app y ábrela dos veces para que se actualice, y vuelve a cargarlo.`);return}
  await datosPut(d);DATA=d;toast(`Datos del ${d.fecha} cargados: ${d.equipos.length} equipos.`);render()};

/* ---- inicio ---- */
function vInicio(){const u=DATA.ultimaRonda;return`<h2>Empezar la ronda</h2>
<div class="hint">Extintores, botiquines y pulsadores en una sola ronda: cambias de uno a otro con las pestañas. Haz las fotos, marca la revisión y sitúa cada equipo en el plano. Todo se guarda en el móvil aunque cierres la app. Al terminar, <b>Enviar</b>.</div>
${u?`<p class="note">Última ronda cargada en la app: ${esc(u)}.</p>`:""}
<div class="card"><div class="grid"><label class="f">Periodo<select id="i-per">${PER.map(([p,x])=>`<option value="${p}" ${p===((DATA.ronda||{}).periodo||perAct())?"selected":""}>${x}</option>`).join("")}</select></label>
<label class="f">Año<input id="i-anio" type="number" value="${esc((DATA.ronda||{}).anio||new Date().getFullYear())}"></label></div>
<label class="f">Fecha<input id="i-fecha" type="date" value="${hoy()}"></label>
<label class="f">Realizado por<input id="i-por" value="${esc(lsGet("pcim.tecnico")||"")}" placeholder="Nombre y apellidos"></label>
<button class="btn p full" id="i-go">Empezar la ronda</button></div>
<p class="note">${TIPOS.map(([t,x])=>`${DATA.equipos.filter(e=>e.tipo===t).length} ${x.toLowerCase()}`).join(" · ")} (extintores sin los de obra).</p>`}
function bInicio(){$("#i-go").onclick=()=>{const por=$("#i-por").value.trim();if(!por){toast("Pon quién hace la revisión.");return}lsSet("pcim.tecnico",por);
  S.ronda={periodo:$("#i-per").value,anio:$("#i-anio").value,fecha:$("#i-fecha").value||hoy(),realizadoPor:por,creado:new Date().toISOString()};lsSet("pcim.ronda",S.ronda);S.view="lista";render()}}

/* ---- lista ---- */
function chip(e){const it=S.items[e.id];const p=pos(e);const sit=!plano(p.planoId)||p.x==null;
  let c=!revisado(it)&&comprobar(e)?`<span class="chip sit">Comprobar</span>`:!revisado(it)&&cargado(e)?`<span class="chip ok">Ya cargado ✓</span>`:revisado(it)?(malo(it.fila)?`<span class="chip nc">No conforme</span>`:`<span class="chip ok">Hecho${it.fotos.length?" · "+it.fotos.length+" 📷":""}</span>`):`<span class="chip">Pendiente</span>`;
  if(sit)c+=` <span class="chip sit">Sin situar</span>`;else if(it&&it.pos)c+=` <span class="chip sit">📍 nuevo</span>`;return`<div style="text-align:right">${c}</div>`}
function vLista(){const r=S.ronda,t=S.tab,eqs=eqsTipo(t),hechos=eqs.filter(e=>done(e)).length,nc=eqs.filter(e=>revisado(S.items[e.id])&&malo(S.items[e.id].fila)).length,se=sinEnviar();
  const l=eqs.filter(e=>{const p=pos(e);return!S.fPlano||(S.fPlano==="_"?(!plano(p.planoId)||p.x==null):p.planoId===S.fPlano)}).filter(e=>!S.soloPend||!done(e));
  return`<div class="tabs" role="group" aria-label="Tipo de equipo">${TIPOS.map(([k,x])=>{const q=eqsTipo(k);return`<button data-tab="${k}" aria-pressed="${t===k}">${x}<small>${q.filter(e=>done(e)).length}/${q.length}</small></button>`}).join("")}</div>
  <div class="kpis"><div class="kpi"><span>Revisados</span><b>${hechos} / ${eqs.length}</b></div><div class="kpi"><span>No conformes</span><b style="color:${nc?"var(--fire)":"inherit"}">${nc}</b></div><div class="kpi"><span>${esc(PER.find(x=>x[0]===r.periodo)?.[1]||r.periodo)} ${esc(r.anio)}</span><b style="font-size:13px">${fmt(r.fecha)} · ${esc(r.realizadoPor)}</b></div></div>
  ${t==="pulsador"?`<div class="hint">Pulsadores: solo inspección visual. La prueba de funcionamiento la hace la mantenedora en la revisión anual.</div>`:""}
  <div class="row" style="margin-bottom:10px"><select id="l-pl" class="grow" style="width:auto"><option value="">Todos los planos</option>${DATA.planos.map(p=>`<option value="${p.id}" ${S.fPlano===p.id?"selected":""}>${esc(p.nombre)}</option>`).join("")}<option value="_" ${S.fPlano==="_"?"selected":""}>Sin situar</option></select>
  <label class="row" style="gap:6px;font-size:14px"><input type="checkbox" id="l-sp" style="width:auto" ${S.soloPend?"checked":""}> Solo pendientes</label></div>
  ${l.map(e=>{const p=plano(pos(e).planoId);return`<button class="it" data-eq="${e.id}"><span class="dot ${e.tipo}"></span><div class="grow"><b class="mono">${esc(e.numSerie||e.codigo||"Nuevo")}</b> <span class="note">${esc(e.numSerie?e.codigo:(e.codigo?"":"alta en la ronda"))}</span><div class="note">${esc(e.ubicacion||"")}${p?" · "+esc(p.nombre):""}${e.ultTrimestral?" · última "+fmt(e.ultTrimestral):""}</div></div>${chip(e)}</button>`}).join("")||`<p class="note">Nada que mostrar con este filtro.</p>`}
  <button class="btn full" id="l-new" style="margin-top:4px">＋ ${t==="extintor"?"Extintor":t==="botiquin"?"Botiquín":"Pulsador"} que no está en la lista</button>
  <div class="bar"><button class="btn t" id="l-env">📤 Enviar${se?` (${se} sin enviar)`:""}</button></div>`}
function bLista(){$$("[data-tab]").forEach(b=>b.onclick=()=>{S.scroll[S.tab]=window.scrollY;S.tab=b.dataset.tab;lsSet("pcim.tab",S.tab);render()});
  $$("[data-eq]").forEach(b=>b.onclick=()=>{S.scroll[S.tab]=window.scrollY;S.eq=b.dataset.eq;S.view="eq";render()});
  $("#l-pl").onchange=e=>{S.fPlano=e.target.value;lsSet("pcim.fplano",S.fPlano);render()};$("#l-sp").onchange=e=>{S.soloPend=e.target.checked;lsSet("pcim.pend",S.soloPend);render()};
  $("#l-new").onclick=async()=>{const id="nuevo-"+S.tab+"-"+Date.now();const v={nuevo:{tipo:S.tab,codigo:"",numSerie:"",ubicacion:"",agente:"",capacidad:"",planoId:S.fPlano&&S.fPlano!=="_"?S.fPlano:null,x:null,y:null},fotos:[],fila:null};await dbPut(id,v);S.items[id]=v;S.scroll[S.tab]=window.scrollY;S.eq=id;S.view="eq";render()};
  $("#l-env").onclick=()=>{S.scroll[S.tab]=window.scrollY;S.view="enviar";render()}}

/* ---- equipo ---- */
const LB={senal:"Señalización",botella:"Estado botella",presion:"Presión manómetro",manguera:"Manguera / boquilla",estado:"Estado",contenido:"Contenido completo",accesible:"Accesible, visible y señalizado",tapa:"Tapa / cristal intacto"};
const OP={SN:[["SI","Sí"],["NO","No"]],C:[["C","OK"],["NC","No conforme"]],PRES:[["C","OK · aguja en verde"],["L","OK · en el límite del verde"],["NC","No conforme · en rojo"],["NA","N/A (CO2, sin manómetro)"]]};
let urls=[];
const fotoTag=f=>f.tag||"Foto";
function vEq(){const e=eqById(S.eq);if(!e){S.view="lista";return vLista()}const t=e.tipo,ext=t==="extintor",bot=t==="botiquin",pul=t==="pulsador";const it=S.items[e.id]||{fotos:[]};
  S.cur={fila:JSON.parse(JSON.stringify(it.fila||filaDef(e))),fotos:(it.fotos||[]).slice(),pos:it.pos?{...it.pos}:null,nuevo:it.nuevo?{...it.nuevo}:null,guardado:!!it.guardado,picking:false};
  const f=S.cur.fila;urls.forEach(u=>URL.revokeObjectURL(u));urls=S.cur.fotos.map(x=>URL.createObjectURL(x.b));
  const cls=v=>v==="NC"||v==="NO"?"bad":v==="L"?"lim":"";
  const sel=(k,o,l)=>`<label class="f">${l||LB[k]}<select data-f="${k}" class="${cls(f[k])}" ${f.noLoc||f.retirado?"disabled":""}>${o.map(([v,x])=>`<option value="${v}" ${f[k]===v?"selected":""}>${x}</option>`).join("")}</select></label>${defecto(k,f[k])}`;
  const nv=S.cur.nuevo;
  return`<button class="btn" id="e-back">← Lista</button>
  <h2 style="margin-top:12px"><span class="dot ${t}" style="display:inline-block;margin-right:6px"></span><span class="mono">${esc(e.numSerie||e.codigo||"Nuevo")}</span> <span class="note">${esc(e.numSerie?e.codigo:(e.codigo?"":"alta en la ronda"))}</span></h2>
